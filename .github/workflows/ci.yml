name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE

permissions:
  contents: read

# The Zig that builds native libraries in both jobs, which the key of the
# SQLite plugin's native module in the Actions cache names too.
env:
  ZIG_VERSION: 0.16.0

# A push supersedes the runs before it on a pull request: the newest commit's
# run covers theirs. On main a run that started finishes, so that main has a
# history to tell whether a test that fails on a pull request fails without
# it; at most the newest commit waits behind it, and GitHub cancels the older
# ones waiting. A release commit runs on its own, so that it is neither queued
# behind nor canceled by others, as its tag waits for its run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ startsWith(github.event.head_commit.message, 'Release ') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # GStreamer's plugins play the videos of ui/video's tests.
      LINUX_PACKAGES: libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # setup-bun keeps a pinned Bun in the Actions cache, and downloads the
      # latest from GitHub's releases, which answer 504 now and then, on
      # every job.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Ubuntu's mirrors are slow now and then (9 minutes for these packages
      # once), so the packages are kept in the Actions cache, under a key of
      # the files apt would download for them.
      - name: List the packages for WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        id: apt
        run: |
          sudo apt-get update
          debs=$(apt-get install --print-uris -qq -y --no-install-recommends $LINUX_PACKAGES | awk '{print $2}' | sort | sha256sum | cut -c1-16)
          echo "prefix=apt-$ImageOS-${{ runner.arch }}-" >> "$GITHUB_OUTPUT"
          echo "key=apt-$ImageOS-${{ runner.arch }}-$debs" >> "$GITHUB_OUTPUT"
      - name: Restore the packages
        if: runner.os == 'Linux'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}
      - name: Install WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          apt="-o Dir::Cache::Archives=$HOME/.cache/apt-archives -o APT::Sandbox::User=root"
          sudo apt-get install -y --no-install-recommends $apt $LINUX_PACKAGES
          # Drops what a restored older cache has that the mirror no longer does.
          sudo apt-get autoclean $apt
          sudo chown -R "$USER" ~/.cache/apt-archives
      - name: Save the packages
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt.outputs.key }}
      - run: bun install --frozen-lockfile
      - name: Build the JavaScript packages
        run: bun run build
      - name: Build and vet every platform
        if: runner.os == 'Linux'
        run: |
          for os in darwin linux windows; do
            GOOS=$os go build ./...
            GOOS=$os go vet ./...
            # Production builds leave the inspector of native UI out.
            GOOS=$os go vet -tags mygo_noinspector ./...
          done
          GOOS=freebsd go build ./...
          # 32-bit Windows and Linux have no backend, but compile.
          GOOS=windows GOARCH=386 go build ./...
          GOOS=linux GOARCH=386 go build ./...
          # Browsers run native UI; the CLI is for desktops.
          export GOOS=js GOARCH=wasm
          go build $(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v /cmd/mygo)
          go vet $(go list ./... | grep -v /cmd/mygo)
          go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/web ./internal/gpu/gl
          # The canvas engine's line breaking, with a canvas of its test's.
          go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -run 'TestCanvas|TestKeepWords' ./internal/text
      # The plugins' tests load the native libraries their mygo-plugin.json
      # pins, and on Windows the installer tests run the NSIS that
      # internal/nsis pins, all of which they download into the user's cache
      # when it lacks them. Downloading them here, before the tests, and
      # keeping them in the Actions cache under a key of what pins them,
      # keeps the tests off the network and its hosts' passing failures.
      - name: Restore the downloads of the tests
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/natives
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/nsis-*
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugins/*/mygo-plugin.json', 'internal/nsis/nsis.go') }}
      - name: Download what the tests need
        run: go run ./internal/prefetch
      - name: Save the downloads of the tests
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/natives
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/nsis-*
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The SQLite plugin's native module, from its Zig and the SQLite its
      # build.zig.zon pins, which the plugin's tests and the end-to-end
      # tests load: built here, so that they test these sources. The build
      # takes minutes, and the emulated Zig of the Windows ARM64 job runs
      # past that job's limit now and then, so the library it builds into
      # .mygo/native is kept in the Actions cache, under a key of all the
      # build reads: the module's files, Zig's version, and the CLI code
      # that generates the module's Go and Zig and builds them. A hit skips
      # the build; any change to these misses, and builds.
      - name: Find where the SQLite plugin's native module goes
        id: sqlitecore
        shell: bash
        run: |
          case $RUNNER_OS in Windows) lib=Sqlitecore.dll ;; macOS) lib=libSqlitecore.dylib ;; *) lib=libSqlitecore.so ;; esac
          echo "path=.mygo/native/$(go env GOOS)-$(go env GOARCH)/$lib" >> "$GITHUB_OUTPUT"
      - name: Restore the SQLite plugin's native module
        id: sqlitecore-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.sqlitecore.outputs.path }}
          key: sqlitecore-${{ runner.os }}-${{ runner.arch }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('plugins/sqlite/internal/sqlitecore/**', 'internal/nativegen/**', 'internal/nativelib/**', 'cmd/mygo/native*.go', 'go.mod') }}
      - name: Build the SQLite plugin's native module
        id: sqlitecore-build
        if: steps.sqlitecore-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go run ./cmd/mygo native build -target host plugins/sqlite/internal/sqlitecore
          # The build regenerates the module's Go and Zig first, which a
          # hit does not: only a build of the files as committed is kept.
          if [ -z "$(git status --porcelain -- plugins/sqlite/internal/sqlitecore)" ]; then echo "committed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the SQLite plugin's native module
        if: steps.sqlitecore-cache.outputs.cache-hit != 'true' && steps.sqlitecore-build.outputs.committed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.sqlitecore.outputs.path }}
          key: ${{ steps.sqlitecore-cache.outputs.cache-primary-key }}
      # The module loads a build in .mygo/native only if it is newer than
      # its sources, and the cache restores the time it was built, before
      # this checkout.
      - name: Date the restored module after its sources
        if: steps.sqlitecore-cache.outputs.cache-hit == 'true'
        shell: bash
        run: touch "${{ steps.sqlitecore.outputs.path }}"
      # cmd/mygo builds and packages apps, which takes the macOS runners
      # about six minutes and, on a slow one beside the other packages,
      # past go test's ten: the same tests, more time.
      - run: go test -timeout ${{ runner.os == 'macOS' && '20m' || '10m' }} ./...
      # A Rust crate that the CLI builds and package ffi binds, with the
      # cargo of the runners' images, which go test ./... skips unbuilt.
      - name: Test a native library built from its sources
        env:
          MYGO_NATIVE_TESTS: 1
        run: |
          go run ./cmd/mygo native build -target host examples/rust-native
          go test -count=1 ./examples/rust-native/...
      # A native module's three implementations, built with the runners'
      # own Swift (Xcode's, and that of Ubuntu's image) and cargo, and Zig:
      # every kind of value both ways, which go test ./... skips unbuilt. On
      # macOS, the examples too, whose Swift uses Apple's frameworks.
      - name: Test a native module built from its Swift
        if: runner.os != 'Windows'
        run: |
          go run ./cmd/mygo native build -target host -lang swift native/internal/roundtrip/uses  # and roundtrip, which it uses
          go test -count=1 ./native/internal/roundtrip/...
      - name: Test a native module built from its Rust, and from its Zig
        shell: bash
        run: |
          go test -count=1 -run TestScaffoldBuildsRustZig ./internal/nativegen
          for lang in rust zig; do
            go run ./cmd/mygo native build -target host -lang $lang native/internal/roundtrip
            out=$(go test -count=1 -v ./native/internal/roundtrip) || { echo "$out"; exit 1; }
            if grep -- '--- SKIP' <<<"$out"; then exit 1; fi  # as when the library did not load
            echo "$lang: $(grep -c -- '--- PASS' <<<"$out") tests passed"
          done
      - name: Build the example's native modules
        if: runner.os == 'macOS'
        working-directory: examples/native-module
        run: for m in language motion places; do go run ../../cmd/mygo native check modules/$m; done
      - name: Test without the inspector, as production builds
        if: runner.os == 'Linux'
        run: go test -tags mygo_noinspector ./ui .
      - run: bun run test
      - run: bun run typecheck
      - name: GUI tests
        if: runner.os != 'Linux'
        env:
          MYGO_E2E: 1
        run: go test ./internal/e2e
      - name: GUI tests
        if: runner.os == 'Linux'
        env:
          MYGO_E2E: 1
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        run: xvfb-run -a dbus-run-session -- go test ./internal/e2e
      # Runners have no GPU, so native UI draws on the CPU above; MYGO_GPU=1
      # draws it with OpenGL all the same, on Mesa's llvmpipe.
      - name: GUI tests of native UI drawn with OpenGL
        if: runner.os == 'Linux'
        env:
          MYGO_E2E: 1
          MYGO_GPU: 1
        run: xvfb-run -a dbus-run-session -- go test -run 'TestContentWindow' ./internal/e2e

  # Windows on ARM64, which no machine of the maintainers runs: DirectWrite's
  # methods taking floats go through purego, which sets the floating point
  # registers syscall leaves alone there, and Direct3D 11 draws native UI.
  # The JavaScript packages are the same everywhere, so Bun is left out.
  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # As in the job above.
      - name: Restore the downloads of the tests
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/natives
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/nsis-*
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugins/*/mygo-plugin.json', 'internal/nsis/nsis.go') }}
      - name: Download what the tests need
        run: go run ./internal/prefetch
      - name: Save the downloads of the tests
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/natives
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/nsis-*
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # Zig 0.16's aarch64 Windows build crashes running zig build (the
      # build runner segfaults at once), so this job uses its x86_64
      # build, which Windows runs emulated and which cross-compiles the
      # arm64 library just the same.
      - name: Install Zig (x86_64)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP"
          "$env:RUNNER_TEMP\zig-x86_64-windows-$env:ZIG_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # As in the job above. The emulated build takes five or six minutes,
      # and twice it ran past 25, until the job's limit canceled it: one
      # that runs past 15 fails then, naming this step, rather than
      # leaving the job's limit to cancel it.
      - name: Find where the SQLite plugin's native module goes
        id: sqlitecore
        shell: bash
        run: |
          case $RUNNER_OS in Windows) lib=Sqlitecore.dll ;; macOS) lib=libSqlitecore.dylib ;; *) lib=libSqlitecore.so ;; esac
          echo "path=.mygo/native/$(go env GOOS)-$(go env GOARCH)/$lib" >> "$GITHUB_OUTPUT"
      - name: Restore the SQLite plugin's native module
        id: sqlitecore-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.sqlitecore.outputs.path }}
          key: sqlitecore-${{ runner.os }}-${{ runner.arch }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('plugins/sqlite/internal/sqlitecore/**', 'internal/nativegen/**', 'internal/nativelib/**', 'cmd/mygo/native*.go', 'go.mod') }}
      - name: Build the SQLite plugin's native module
        id: sqlitecore-build
        if: steps.sqlitecore-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          go run ./cmd/mygo native build -target host plugins/sqlite/internal/sqlitecore
          if [ -z "$(git status --porcelain -- plugins/sqlite/internal/sqlitecore)" ]; then echo "committed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the SQLite plugin's native module
        if: steps.sqlitecore-cache.outputs.cache-hit != 'true' && steps.sqlitecore-build.outputs.committed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.sqlitecore.outputs.path }}
          key: ${{ steps.sqlitecore-cache.outputs.cache-primary-key }}
      - name: Date the restored module after its sources
        if: steps.sqlitecore-cache.outputs.cache-hit == 'true'
        shell: bash
        run: touch "${{ steps.sqlitecore.outputs.path }}"
      - run: go test ./...
      - name: Test without the inspector, as production builds
        if: runner.os == 'Linux'
        run: go test -tags mygo_noinspector ./ui .
      - name: GUI tests of native UI
        env:
          MYGO_E2E: 1
        run: go test -run 'TestContentWindow' ./internal/e2e
